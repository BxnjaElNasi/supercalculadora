<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supercalculadora</title>
<meta name="description" content="Calculadora científica, regla de tres, porcentajes, ecuaciones y conversor de bases. Funciona sin conexión.">
<meta name="theme-color" content="#5a4026">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Supercalc">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  @font-face { font-family: 'VT323'; src: url('fonts/vt323.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Press Start 2P'; src: url('fonts/press-start-2p.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
</style>
<style>
  /* Layout: una sola columna centrada; panel gris tipo inventario sobre fondo de tierra, pestañas arriba, teclado en cuadrícula de 5 columnas */
  :root {
    --dirt: #5a4026;
    --panel: #c6c6c6;
    --panel-hi: #ffffff;
    --panel-lo: #555555;
    --ink: #3f3f3f;
    --btn: #7e7e7e;
    --btn-hi: #b6b6b6;
    --btn-lo: #4a4a4a;
    --btn-hover: #6f7fb8;
    --btn-op: #6a6a6a;
    --go: #3f8f2f;
    --go-hi: #7fd05f;
    --go-lo: #1f4f17;
    --stop: #a23a32;
    --stop-hi: #e07a70;
    --stop-lo: #5a1c17;
    --screen: #101010;
    --yellow: #ffff55;
    --green: #55ff55;
    --red: #ff5555;
    --grey: #aaaaaa;
    --font-display: 'Press Start 2P', 'Courier New', monospace;
    --font-body: 'VT323', 'Courier New', monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background-color: var(--dirt);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 20px;
    line-height: 1.2;
    margin: 0;
    padding-inline: 16px;
    padding-block: 12px;
    overflow: hidden;
    display: flex;
  }
  /* El marco ocupa exactamente la pantalla: nada de scroll de página */
  .wrap { width: 100%; max-width: 460px; height: 100%; max-height: 880px; margin: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
  .head-text { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .logo {
    font-family: var(--font-display);
    font-size: clamp(13px, 4.4vw, 22px);
    line-height: 1.3;
    color: #fff;
    text-shadow: 3px 3px 0 #3f3f3f;
    margin: 0;
    text-align: left;
    text-wrap: balance;
  }
  .sub { margin: 0; color: #e8d9c0; text-shadow: 2px 2px 0 #2b1d0f; font-size: 1.15rem; letter-spacing: .06em; text-transform: uppercase; }

  .gui {
    background: var(--panel);
    border: 2px solid #000;
    box-shadow: inset 3px 3px 0 var(--panel-hi), inset -3px -3px 0 var(--panel-lo), 6px 6px 0 rgba(0,0,0,.45);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
    min-height: 0;
    flex: 1;
  }
  .panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-width: 0;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 5px;
    margin: -5px;
  }
  .panel::-webkit-scrollbar { display: none; }

  /* Botones al estilo del menú de inicio */
  .mc-btn {
    font-family: var(--font-body);
    font-size: 1.45rem;
    line-height: 1;
    color: #fff;
    text-shadow: 2px 2px 0 #3f3f3f;
    background: var(--btn);
    border: 2px solid #000;
    border-radius: 0;
    box-shadow: inset 3px 3px 0 var(--btn-hi), inset -3px -3px 0 var(--btn-lo);
    min-height: 46px;
    padding: 4px 6px;
    cursor: pointer;
    image-rendering: pixelated;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
  }
  .mc-btn:hover { background: var(--btn-hover); color: var(--yellow); text-shadow: 2px 2px 0 #3a3a1c; }
  .mc-btn:active { box-shadow: inset 3px 3px 0 var(--btn-lo), inset -3px -3px 0 var(--btn-hi); padding-top: 6px; padding-bottom: 2px; }
  .mc-btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  .mc-btn.fn { background: var(--btn-op); font-size: 1.25rem; }
  .mc-btn.fn:hover { background: var(--btn-hover); }
  .mc-btn.go { background: var(--go); box-shadow: inset 3px 3px 0 var(--go-hi), inset -3px -3px 0 var(--go-lo); }
  .mc-btn.go:hover { background: #4fae3c; }
  .mc-btn.go:active { box-shadow: inset 3px 3px 0 var(--go-lo), inset -3px -3px 0 var(--go-hi); }
  .mc-btn.stop { background: var(--stop); box-shadow: inset 3px 3px 0 var(--stop-hi), inset -3px -3px 0 var(--stop-lo); }
  .mc-btn.stop:hover { background: #c04a40; }
  .mc-btn.stop:active { box-shadow: inset 3px 3px 0 var(--stop-lo), inset -3px -3px 0 var(--stop-hi); }
  .mc-btn.sel, .mc-btn[aria-selected="true"], .mc-btn[aria-pressed="true"] {
    background: #4a4a4a;
    color: var(--yellow);
    box-shadow: inset 3px 3px 0 var(--btn-lo), inset -3px -3px 0 #777;
  }
  .mc-btn.small { font-size: 1.15rem; min-height: 38px; padding-inline: 12px; }
  .mc-btn.big { font-size: 1.7rem; min-height: 54px; width: 100%; }

  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .tabs .mc-btn { font-size: 1.05rem; padding-inline: 1px; }

  /* Pantalla hundida */
  .screen {
    background: var(--screen);
    border: 2px solid #000;
    box-shadow: inset 3px 3px 0 #373737, inset -3px -3px 0 #ffffff;
    padding: 8px 14px;
    color: #fff;
    min-width: 0;
    flex: none;
  }
  .screen.fill { flex: 1 1 auto; min-height: 84px; display: flex; flex-direction: column; justify-content: center; overflow-y: auto; scrollbar-width: none; }
  .scr-top { display: flex; justify-content: space-between; gap: 8px; color: var(--grey); font-size: 1.05rem; letter-spacing: .08em; text-transform: uppercase; }
  .expr {
    font-size: clamp(1.3rem, 3.6vh, 1.8rem);
    color: #fff;
    min-height: 1.2em;
    white-space: nowrap;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
    text-align: right;
  }
  .expr::-webkit-scrollbar { display: none; }
  .expr.empty { color: #666; }
  .result {
    font-size: clamp(1.8rem, 5.2vh, 2.6rem);
    line-height: 1.1;
    min-height: 1.15em;
    text-align: right;
    color: var(--yellow);
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: none;
    font-variant-numeric: tabular-nums;
  }
  .result::-webkit-scrollbar { display: none; }
  .result.preview { color: #8a8a55; }
  .result.err { color: var(--red); font-size: 1.6rem; white-space: normal; }

  /* Las 8 filas de teclas se reparten todo el alto disponible */
  .keys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(34px, 1fr)); gap: 6px; flex: 1; min-height: 0; }
  .keys .mc-btn { min-height: 0; padding: 0 2px; font-size: clamp(1.1rem, 3.1vh, 1.5rem); }
  .keys .mc-btn.fn { font-size: clamp(.95rem, 2.6vh, 1.25rem); }
  .keys .mc-btn:active { padding: 2px 2px 0; }
  .span2 { grid-column: span 2; }

  /* Formularios */
  .note { margin: 0; color: var(--ink); font-size: 1.15rem; }
  .note b { color: #1f1f1f; font-weight: normal; text-decoration: underline; text-decoration-style: dotted; }
  .fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .fld > span { font-size: 1.2rem; letter-spacing: .05em; text-transform: uppercase; }
  .mc-input, .mc-out {
    font-family: var(--font-body);
    font-size: 1.8rem;
    color: #fff;
    background: #000;
    border: 2px solid #a0a0a0;
    border-radius: 0;
    padding: 6px 10px;
    min-height: 48px;
    width: 100%;
    min-width: 0;
    caret-color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .mc-input:focus { outline: none; border-color: #fff; box-shadow: 0 0 0 2px #000, 0 0 0 4px #fff; }
  .mc-input::placeholder { color: #666; }
  .mc-out { display: flex; align-items: center; color: var(--yellow); overflow-x: auto; white-space: nowrap; }
  .rt-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px 8px; align-items: end; }
  .arrow { font-family: var(--font-display); font-size: 1rem; color: var(--ink); padding-bottom: 16px; }
  .row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .row3 { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .out-line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .out-line + .out-line { margin-top: 8px; padding-top: 8px; border-top: 2px solid #2a2a2a; }
  .out-label { color: var(--grey); font-size: 1.2rem; }
  .out-val { color: var(--yellow); font-size: 2.2rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .out-val.alt { color: var(--green); }
  .out-formula { color: var(--grey); font-size: 1.15rem; margin-top: 6px; overflow-wrap: anywhere; }
  .out-msg { color: var(--red); font-size: 1.4rem; }
  .out-msg.soft { color: var(--grey); }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .hint { margin: 0; font-size: 1.05rem; color: #5a5a5a; min-width: 0; flex: 1 1 200px; }
  .keys.alt .p1, .keys:not(.alt) .p2 { display: none; }
  .row3c { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .row3c .mc-btn.small { padding-inline: 2px; }
  .eq-grid { display: grid; gap: 6px; }
  .eq-grid .mc-input { font-size: 1.4rem; padding: 4px 6px; min-height: 42px; }
  [hidden] { display: none !important; }

  .head .mc-btn.small { flex: none; min-height: 34px; font-size: 1.05rem; padding-inline: 10px; }
  @media (max-width: 520px), (max-height: 780px) { .hint { display: none; } }
  @media (max-width: 380px) {
    body { padding-inline: 10px; }
    .gui { padding: 10px; }
    .keys { gap: 5px; }
    .tabs .mc-btn { font-size: .95rem; }
    .fld > span { font-size: 1rem; }
    .mc-input, .mc-out { font-size: 1.5rem; padding-inline: 8px; }
    .out-val { font-size: 1.8rem; }
  }
  @media (max-height: 760px) {
    .sub { display: none; }
    body { padding-block: 8px; }
    .wrap { gap: 8px; }
    .gui, .panel { gap: 8px; }
    .mc-btn.small { min-height: 34px; }
    .mc-input, .mc-out { min-height: 42px; font-size: 1.6rem; }
    .mc-btn.big { min-height: 46px; font-size: 1.5rem; }
    .arrow { padding-bottom: 12px; }
    .note { font-size: 1.05rem; }
  }
  @media (max-height: 620px) {
    .tabs .mc-btn { min-height: 38px; }
    .screen { padding-block: 5px; }
    .scr-top { font-size: .95rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Modo app instalada: respetar notch y barra de gestos */
  html { background: #5a4026; }
  body { padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  body { -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
</style>

</head>
<body>
<main class="wrap">
  <header class="head">
    <div class="head-text">
      <h1 class="logo">Supercalculadora</h1>
      <p class="sub">Científica · Regla de 3 · % · Ecuaciones · Conversor</p>
    </div>
    <button class="mc-btn small" id="snd" aria-pressed="true">Sonido: SÍ</button>
  </header>

  <section class="gui" aria-label="Calculadora">
    <div class="tabs" role="tablist" aria-label="Herramientas">
      <button class="mc-btn" role="tab" id="t-sci" data-tab="sci" aria-selected="true" aria-controls="p-sci">Cient.</button>
      <button class="mc-btn" role="tab" id="t-rt" data-tab="rt" aria-selected="false" aria-controls="p-rt">Regla 3</button>
      <button class="mc-btn" role="tab" id="t-pc" data-tab="pc" aria-selected="false" aria-controls="p-pc">%</button>
      <button class="mc-btn" role="tab" id="t-eq" data-tab="eq" aria-selected="false" aria-controls="p-eq">Ecuac.</button>
      <button class="mc-btn" role="tab" id="t-cv" data-tab="cv" aria-selected="false" aria-controls="p-cv">Conv.</button>
    </div>

    <!-- CIENTÍFICA -->
    <div id="p-sci" class="panel" role="tabpanel" aria-labelledby="t-sci">
      <div class="screen" aria-live="polite">
        <div class="scr-top"><span id="angle-label">Grados</span><span>Ans <span id="ans-label">0</span></span></div>
        <div class="expr empty" id="expr">0</div>
        <div class="result" id="res"></div>
      </div>
      <div class="keys" id="keys">
        <button class="mc-btn fn p1" data-a="alt">2ND</button>
        <button class="mc-btn fn p1" data-a="deg" id="deg-btn">DEG</button>
        <button class="mc-btn fn p1" data-k="π">π</button>
                <button class="mc-btn fn p1" data-k="Ans">Ans</button>
        <button class="mc-btn fn p1" data-a="del">DEL</button>

        <button class="mc-btn fn p1" data-k="sin(">sin</button>
        <button class="mc-btn fn p1" data-k="cos(">cos</button>
        <button class="mc-btn fn p1" data-k="tan(">tan</button>
        <button class="mc-btn fn p1" data-k="(">(</button>
        <button class="mc-btn fn p1" data-k=")">)</button>

        <button class="mc-btn fn p1" data-k="asin(">sin⁻¹</button>
        <button class="mc-btn fn p1" data-k="acos(">cos⁻¹</button>
        <button class="mc-btn fn p1" data-k="atan(">tan⁻¹</button>
        <button class="mc-btn fn p1" data-k="^2">x²</button>
        <button class="mc-btn fn p1" data-k="^">xʸ</button>

        <button class="mc-btn fn p1" data-k="log(">log</button>
        <button class="mc-btn fn p1" data-k="ln(">ln</button>
        <button class="mc-btn fn p1" data-k="√(">√</button>
        <button class="mc-btn fn p1" data-k="!">n!</button>
        <button class="mc-btn fn p1" data-k="^(-1)">1/x</button>

        <button class="mc-btn fn p2 sel" data-a="alt">2ND</button>
        <button class="mc-btn fn p2" data-a="m+">M+</button>
        <button class="mc-btn fn p2" data-a="m-">M−</button>
        <button class="mc-btn fn p2" data-k="M">MR</button>
        <button class="mc-btn fn p2" data-a="del">DEL</button>
        <button class="mc-btn fn p2" data-k="sinh(">sinh</button>
        <button class="mc-btn fn p2" data-k="cosh(">cosh</button>
        <button class="mc-btn fn p2" data-k="tanh(">tanh</button>
        <button class="mc-btn fn p2" data-k="nPr">nPr</button>
        <button class="mc-btn fn p2" data-k="nCr">nCr</button>
        <button class="mc-btn fn p2" data-k="10^(">10ˣ</button>
        <button class="mc-btn fn p2" data-k="e^(">eˣ</button>
        <button class="mc-btn fn p2" data-k="∛(">∛</button>
        <button class="mc-btn fn p2" data-k="root">ʸ√</button>
        <button class="mc-btn fn p2" data-k="abs(">Abs</button>
        <button class="mc-btn fn p2" data-k="e">e</button>
        <button class="mc-btn fn p2" data-k="^3">x³</button>
        <button class="mc-btn fn p2" data-k="mod">mod</button>
        <button class="mc-btn fn p2" data-k="Ran">Ran#</button>
        <button class="mc-btn fn p2" data-a="sd">S⇔D</button>
        
        <button class="mc-btn" data-k="7">7</button>
        <button class="mc-btn" data-k="8">8</button>
        <button class="mc-btn" data-k="9">9</button>
        <button class="mc-btn fn" data-k="÷">÷</button>
        <button class="mc-btn stop" data-a="ac">AC</button>

        <button class="mc-btn" data-k="4">4</button>
        <button class="mc-btn" data-k="5">5</button>
        <button class="mc-btn" data-k="6">6</button>
        <button class="mc-btn fn" data-k="×">×</button>
        <button class="mc-btn fn" data-k="%">%</button>

        <button class="mc-btn" data-k="1">1</button>
        <button class="mc-btn" data-k="2">2</button>
        <button class="mc-btn" data-k="3">3</button>
        <button class="mc-btn fn" data-k="−">−</button>
        <button class="mc-btn fn" data-k="+">+</button>

        <button class="mc-btn span2" data-k="0">0</button>
        <button class="mc-btn" data-k=",">,</button>
        <button class="mc-btn fn" data-k="×10^(">×10ˣ</button>
        <button class="mc-btn go" data-a="eq">=</button>
      </div>
      <p class="hint">También funciona con el teclado: números, + − * / ^ ( ), Enter, Retroceso y Esc.</p>
    </div>

    <!-- REGLA DE TRES -->
    <div id="p-rt" class="panel" role="tabpanel" aria-labelledby="t-rt" hidden>
      <p class="note">Ejemplo cargado: si <b>2 mol</b> pesan <b>150 g</b>, ¿cuánto pesan <b>5 mol</b>?</p>
      <div class="row2" role="group" aria-label="Tipo de proporción">
        <button class="mc-btn small" id="rt-direct" aria-pressed="true">Directa</button>
        <button class="mc-btn small" id="rt-inverse" aria-pressed="false">Inversa</button>
      </div>
      <p class="note" id="rt-sentence">A es a B como C es a X</p>
      <div class="rt-grid">
        <label class="fld"><span>A</span><input class="mc-input" id="rt-a" inputmode="decimal" autocomplete="off" value="2"></label>
        <span class="arrow" aria-hidden="true">→</span>
        <label class="fld"><span>B</span><input class="mc-input" id="rt-b" inputmode="decimal" autocomplete="off" value="150"></label>
        <label class="fld"><span>C</span><input class="mc-input" id="rt-c" inputmode="decimal" autocomplete="off" value="5"></label>
        <span class="arrow" aria-hidden="true">→</span>
        <div class="fld"><span>X</span><output class="mc-out" id="rt-x" for="rt-a rt-b rt-c">?</output></div>
      </div>
      <button class="mc-btn go big" id="rt-calc">Calcular X</button>
      <div class="screen fill" aria-live="polite" id="rt-out"></div>
    </div>

    <!-- PORCENTAJES -->
    <div id="p-pc" class="panel" role="tabpanel" aria-labelledby="t-pc" hidden>
      <div class="row3" role="group" aria-label="Tipo de cálculo">
        <button class="mc-btn small" data-pc="0" aria-pressed="true">¿Cuánto es el X% de Y?</button>
        <button class="mc-btn small" data-pc="1" aria-pressed="false">¿Qué % es A de B?</button>
        <button class="mc-btn small" data-pc="2" aria-pressed="false">Aumento y descuento</button>
      </div>
      <p class="note" id="pc-note"></p>
      <div class="fields" id="pc-fields"></div>
      <div class="screen fill" aria-live="polite" id="pc-out"></div>
    </div>

    <!-- ECUACIONES -->
    <div id="p-eq" class="panel" role="tabpanel" aria-labelledby="t-eq" hidden>
      <div class="row3c" role="group" aria-label="Incógnitas">
        <button class="mc-btn small" data-eq="1" aria-pressed="true">1 incógnita</button>
        <button class="mc-btn small" data-eq="2" aria-pressed="false">2 incógnitas</button>
        <button class="mc-btn small" data-eq="3" aria-pressed="false">3 incógnitas</button>
      </div>
      <p class="note" id="eq-note"></p>
      <div class="eq-grid" id="eq-grid"></div>
      <div class="screen fill" aria-live="polite" id="eq-out"></div>
    </div>

    <!-- CONVERSOR -->
    <div id="p-cv" class="panel" role="tabpanel" aria-labelledby="t-cv" hidden>
      <div class="row3c" role="group" aria-label="Sistema de entrada">
        <button class="mc-btn small" data-cv="0" aria-pressed="true">Dec / Frac</button>
        <button class="mc-btn small" data-cv="1" aria-pressed="false">Hex</button>
        <button class="mc-btn small" data-cv="2" aria-pressed="false">Bin</button>
      </div>
      <label class="fld"><span id="cv-lbl"></span><input class="mc-input" id="cv-in" autocomplete="off" autocapitalize="characters" spellcheck="false" value="0,75"></label>
      <div class="screen fill" aria-live="polite" id="cv-out"></div>
    </div>
  </section>
</main>

<script>
// <math>
var FN = {
  sin: function (x, c) { return clean(Math.sin(c.deg ? x * Math.PI / 180 : x)); },
  cos: function (x, c) { return clean(Math.cos(c.deg ? x * Math.PI / 180 : x)); },

  };
  function solveN(M, n) {
    var i, j, c, p, t, f;
    for (c = 0; c < n; c++) {
      p = c; for (i = c + 1; i < n; i++) if (Math.abs(M[i][c]) > Math.abs(M[p][c])) p = i;
      if (Math.abs(M[p][c]) < 1e-10) return null;
      t = M[c]; M[c] = M[p]; M[p] = t;
      for (i = 0; i < n; i++) if (i !== c) { f = M[i][c] / M[c][c]; for (j = c; j <= n; j++) M[i][j] -= f * M[c][j]; }
    }
    return M.map(function (r, i) { return r[n] / r[i]; });
  }
  function eqCalc() {
    var cols = eqN === 1 ? 3 : eqN + 1, tot = eqN * cols, v = [], i, out = $('eq-out'), r;
    for (i = 0; i < tot; i++) { EQV[eqN][i] = $('eq-i' + i).value; v.push(pv(EQV[eqN][i])); }
    if (v.some(isNaN)) { out.innerHTML = '<div class="out-msg soft">Completá todos los casilleros con números (sirven fracciones como 1/2).</div>'; return; }
    if (eqN === 1) {
      if (v[0] === 0) { out.innerHTML = '<div class="out-msg">a no puede ser 0.</div>'; return; }
      r = [(v[2] - v[1]) / v[0]];
    } else {
      var M = []; for (i = 0; i < eqN; i++) M.push(v.slice(i * cols, i * cols + cols));
      r = solveN(M, eqN);
      if (!r) { out.innerHTML = '<div class="out-msg">No hay una única solución (puede haber infinitas o ninguna).</div>'; return; }
    }
    out.innerHTML = r.map(function (x, i) {
      x = Math.abs(x) < 1e-12 ? 0 : x;
      var f = toFrac(x);
      return line(['x', 'y', 'z'][i] + (f && f.d > 1 ? ' = ' + f.imp : ' ='), fmt(x), i % 2 === 1);
    }).join('');
  }
  function eqRender() {
    var cols = eqN === 1 ? 3 : eqN + 1, h = '', i;
    for (i = 0; i < eqN * cols; i++) {
      var ph = EQP[eqN][i % cols];
      h += '<input class="mc-input" id="eq-i' + i + '" aria-label="' + attr(ph) + '" placeholder="' + attr(ph) + '" autocomplete="off" value="' + attr(EQV[eqN][i]) + '">';
    }
    var g = $('eq-grid'); g.style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))'; g.innerHTML = h;
    $('eq-note').textContent = EQT[eqN];
    document.querySelectorAll('[data-eq]').forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-eq')) === eqN)); });
    eqCalc();
  }
  document.querySelectorAll('[data-eq]').forEach(function (b) {
    b.addEventListener('click', function () { eqN = Number(b.getAttribute('data-eq')); eqRender(); });
  });
  $('eq-grid').addEventListener('input', eqCalc);
  eqRender();

  /* ---------- Conversor: decimal · fracción · hexadecimal · binario ---------- */
  var cvMode = 0, CVB = [10, 16, 2];
  var CVL = ['Decimal o fracción (0,75 · 3/4 · 1 1/2)', 'Hexadecimal (0-9 y A-F)', 'Binario (solo 0 y 1)'];
  function parseBase(s, b) {
    s = s.replace(/[\s_]/g, '').replace(',', '.');
    var neg = /^-/.test(s); s = s.replace(/^[+-]/, '');
    var p = s.split('.'), v = 0, f = 1 / b, i, d;
    if (p.length > 2 || !s.replace('.', '')) return NaN;
    for (i = 0; i < p[0].length; i++) { d = parseInt(p[0][i], b); if (isNaN(d)) return NaN; v = v * b + d; }
    for (i = 0; i < (p[1] || '').length; i++) { d = parseInt(p[1][i], b); if (isNaN(d)) return NaN; v += d * f; f /= b; }
    return neg ? -v : v;
  }
  function parseDec(s) {
    s = s.trim();
    var m = s.match(/^(-?)\s*(?:(\d+)\s+)?(\d+)\s*\/\s*(\d+)$/);
    if (m) { if (+m[4] === 0) return NaN; var v = (+m[2] || 0) + (+m[3]) / (+m[4]); return m[1] ? -v : v; }
    return pv(s.replace(/\s/g, ''));
  }
  function cvVal() { var s = $('cv-in').value; return cvMode === 0 ? parseDec(s) : parseBase(s, CVB[cvMode]); }
  function cvCalc() {
    var v = cvVal(), out = $('cv-out');
    if (isNaN(v) || !isFinite(v)) { out.innerHTML = '<div class="out-msg soft">Escribí un número válido para este sistema.</div>'; return; }
    var f = toFrac(v), ft = f ? (f.txt !== f.imp ? f.imp + '  (' + f.txt + ')' : f.imp) : 'sin fracción simple';
    out.innerHTML = line('Decimal', fmt(v)) + line('Fracción', ft, true) +
      line('Hexadecimal', v.toString(16).toUpperCase()) + line('Binario', v.toString(2), true);
  }
  function cvRender() {
    $('cv-lbl').textContent = CVL[cvMode];
    document.querySelectorAll('[data-cv]').forEach(function (b) { b.setAttribute('aria-pressed', String(Number(b.getAttribute('data-cv')) === cvMode)); });
    cvCalc();
  }
  document.querySelectorAll('[data-cv]').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = cvVal(), m = Number(b.getAttribute('data-cv'));
      cvMode = m;
      if (!isNaN(v) && isFinite(v)) $('cv-in').value = m === 0 ? fmt(v) : v.toString(CVB[m]).toUpperCase();
      cvRender();
    });
  });
  $('cv-in').addEventListener('input', cvCalc);
  cvRender();
})();
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
